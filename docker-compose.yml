name: projection-witness

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: projection_witness
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      POSTGRES_PASSWORD: projection_witness_local_only
      POSTGRES_USER: pw_migrator
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pw_migrator -d projection_witness]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: 128mb
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: