name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: projection_witness_test
          POSTGRES_PASSWORD: projection_witness_test
          POSTGRES_USER: pw_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pw_migrator -d projection_witness_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: true
      DATABASE_URL_MIGRATOR: postgresql://pw_migrator:projection_witness_test@127.0.0.1:5432/projection_witness_test
      DATABASE_URL_API: postgresql://pw_api:projection_witness_api_test@127.0.0.1:5432/projection_witness_test
      DATABASE_URL_PROJECTOR: postgresql://pw_projector:projection_witness_projector_test@127.0.0.1:5432/projection_witness_test
      DATABASE_URL_MCP_READ: postgresql://pw_mcp_read:projection_witness_mcp_read_test@127.0.0.1:5432/projection_witness_test
      DATABASE_URL_MCP_WRITE: postgresql://pw_mcp_write:projection_witness_mcp_write_test@127.0.0.1:5432/projection_witness_test
      DATABASE_URL_REPAIR_EXECUTOR: postgresql://pw_repair_executor:projection_witness_repair_executor_test@127.0.0.1:5432/projection_witness_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.9
        working-directory: ${{ runner.temp }}

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.9"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Compose configuration
        run: npm run db:config

      - name: Initialize database roles
        run: |
          npm run db:migrate
          npm run db:bootstrap-roles

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Concurrency tests
        run: npm run test:race

      - name: Build
        run: npm run build